[package]
name = "octo-api"
description = "axum REST API: wallets, addresses, withdrawals, transactions, webhooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
octo-crypto.workspace = true
# `withdrawals::withdraw` pre-flight-checks the wallet balance *before signing*, so `sign_payment`
# must be callable from this crate's lib, not just its tests. The re-export is gated on
# `test-fixtures`, which dev-dependencies alone enable — that satisfies `cargo test` but leaves
# `cargo build -p octo-api` with an unresolved import (E0432). The handler still refuses to sign
# for a client-custody wallet at runtime, so the cutover's guarantee is unchanged.
octo-wallet-core = { workspace = true, features = ["test-fixtures"] }
octo-store.workspace = true
octo-webhooks.workspace = true
octo-resilience.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
# Needed to downcast RequestBodyLimitLayer's error to LengthLimitError (413 handling).
http-body-util = "0.1"
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
zeroize.workspace = true
stellar-base.workspace = true
stellar-strkey.workspace = true
argon2.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tokio.workspace = true
tower.workspace = true
sqlx.workspace = true
stellar-base.workspace = true
dotenvy = "0.15"
reqwest.workspace = true
octo-ingest.workspace = true
# Pinned: newer 0.6.x requires edition2024 (Rust >= 1.85), but rust-toolchain.toml pins 1.84.1,
# so an unpinned "0.6" resolves to a version this project's own toolchain cannot build.
wiremock = "=0.6.2"
# OpenAPI contract drift tests (docs/openapi.yaml) — validate live responses against the spec.
serde_yaml = "0.9"
jsonschema = "0.26"
# Signing fixtures for validation tests only — never enabled in production builds.
octo-wallet-core = { workspace = true, features = ["test-fixtures"] }
