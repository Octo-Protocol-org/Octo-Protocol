openapi: 3.1.0
info:
  title: Octo Protocol API
  version: 1.0.0
  description: OpenAPI contract for the /v1 Octo Protocol routes.
servers:
  - url: /
paths:
  /v1/wallets:
    post:
      summary: Create a master wallet (non-custodial)
      description: >
        Registers a wallet from a keypair the CLIENT generated. The server never receives the
        private key or mnemonic — only the public account. `encrypted_backup` is an opaque blob
        the client encrypted under the user's password; the server stores it verbatim for
        new-device recovery and cannot decrypt it.
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - public_key
              properties:
                public_key:
                  type: string
                  description: The client-generated Stellar account (`G...`).
                encrypted_backup:
                  type: string
                  nullable: true
                  description: >
                    Opaque client-encrypted seed backup. Never decryptable by the server.
                label:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
  /v1/wallets/{id}:
    get:
      summary: Get wallet details
      operationId: getWallet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletViewResponse'
  /v1/wallets/{id}/addresses:
    post:
      summary: Generate a dedicated customer address
      operationId: createAddress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_ref:
                  type: string
                metadata:
                  type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAddressResponse'
    get:
      summary: List addresses
      operationId: listAddresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAddressesResponse'
  /v1/wallets/{id}/withdraw:
    post:
      summary: Withdraw funds
      operationId: withdraw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                amount_stroops:
                  type: integer
                asset:
                  type: object
                  properties:
                    code:
                      type: string
                    issuer:
                      type: string
                  required:
                    - code
                    - issuer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawResponse'
  /v1/wallets/{id}/transactions:
    get:
      summary: List transactions
      operationId: listTransactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          schema:
            type: string
            enum: [deposit, withdrawal]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
  /v1/wallets/{id}/api-key:
    post:
      summary: Generate or rotate the wallet's API key
      description: >
        Dashboard JWT only. The plaintext key is returned once; only its SHA-256 hash is stored.
        The first key needs no body. Once a key exists, `confirm: true` is required to rotate it
        (which immediately invalidates the previous key); without it the call returns 409.
      operationId: generateApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  description: Must be `true` to rotate an existing key.
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: >
                    Key lifetime in days. Must be between 1 and 365; out-of-range values are
                    rejected with 400 rather than clamped.
      responses:
        "201":
          description: Created — the full key, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        "400":
          description: >
            `expires_in_days` is outside 1..=365. Returns `bad_request` with the message
            "expires_in_days must be between 1 and 365".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: A key already exists and `confirm` was not `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /v1/wallets/{id}/payment-links:
    post:
      summary: Create a payment link
      operationId: createPaymentLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                image_url:
                  type: string
                  nullable: true
                redirect_url:
                  type: string
                  nullable: true
                  description: >
                    Where to send the payer's browser after their payment is confirmed. Octo
                    appends `?status=success&payment_id=<id>&slug=<slug>` when redirecting.
                amount_usdc_stroops:
                  type: integer
                  nullable: true
                  description: Fixed amount in USDC stroops (7dp). Omit/null for a flexible-amount link.
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional deadline (future, at most 365 days away). Omit for an open-ended link.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
    get:
      summary: List payment links
      operationId: listPaymentLinks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinksResponse'
  /v1/wallets/{id}/payment-links/{link_id}:
    get:
      summary: Get a payment link
      operationId: getPaymentLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
    put:
      summary: Activate or deactivate a payment link
      operationId: setPaymentLinkActive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
  /v1/wallets/{id}/payment-links/{link_id}/payments:
    get:
      summary: List payments recorded against a payment link
      description: Owner-authenticated only — includes payer name/email.
      operationId: listPaymentLinkPayments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinkPaymentsResponse'
  /v1/wallets/{id}/payment-links/{link_id}/cancel:
    post:
      summary: Cancel a payment link
      description: >
        Permanently close a link (idempotent, `write` scope). Pending payments become `cancelled`;
        later deposits are late and never matched.
      operationId: cancelPaymentLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/wallets/{id}/sponsor/validate:
    post:
      summary: Dry-run a sponsorship
      description: >
        Same validation as `POST /sponsor` plus read-only dedup and budget projections. Never
        signs, reserves budget or writes state.
      operationId: validateSponsor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_xdr:
                  type: string
                max_base_fee_stroops:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsorValidateResponse'
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/wallets/{id}/withdraw/estimate:
    get:
      summary: Estimate a withdrawal's fee and reserve impact
      operationId: withdrawEstimate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: asset_code
          in: query
          schema:
            type: string
        - name: asset_issuer
          in: query
          schema:
            type: string
        - name: amount_stroops
          in: query
          schema:
            type: integer
        - name: operations
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawEstimateResponse'
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/pay/{slug}:
    get:
      summary: Get a public payment link
      description: Public, no auth. Used by the hosted checkout page.
      operationId: getPublicPaymentLink
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPaymentLinkResponse'
  /v1/pay/{slug}/intent:
    post:
      summary: Create a payment intent against a public payment link
      description: Public, no auth, rate-limited by IP.
      operationId: createPaymentIntent
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payer_name:
                  type: string
                  nullable: true
                payer_email:
                  type: string
                  nullable: true
                amount_usdc_stroops:
                  type: integer
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        "429":
          description: >
            Rate limit exceeded (`too_many_requests`). The `Retry-After` header carries the
            remaining window in whole seconds; wait at least that long before retrying.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/pay/{slug}/payments/{payment_id}:
    get:
      summary: Poll a payment's status
      description: Public, no auth.
      operationId: getPaymentStatus
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
  /v1/pay/{slug}/signing-info:
    get:
      summary: Get Stellar signing info for the payer's own account
      description: Public, no auth.
      operationId: publicSigningInfo
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: account
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSigningInfoResponse'
  /v1/pay/{slug}/submit-signed:
    post:
      summary: Relay a payer-signed transaction to Horizon
      description: Public, no auth.
      operationId: submitPayment
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_xdr:
                  type: string
                payment_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPaymentResponse'
        "429":
          description: >
            Rate limit exceeded (`too_many_requests`). The `Retry-After` header carries the
            remaining window in whole seconds; wait at least that long before retrying.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/uploads/signature:
    post:
      summary: Get a signed Cloudinary upload signature
      description: >
        Returns a short-lived signature the client uses to upload media directly to Cloudinary.
        The response never contains the API secret. If the server has no Cloudinary settings
        configured, this endpoint answers 503 (`service_unavailable`) — the request itself was
        valid, so it is not a client error.
      operationId: uploadSignature
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folder:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignatureResponse'
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: >
            Cloudinary uploads are not configured on this server (`service_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhooks:
    post:
      summary: Register a webhook
      operationId: createWebhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                secret:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
components:
  headers:
    RetryAfter:
      description: >
        Seconds to wait before retrying, as a positive integer (the remaining rate-limit
        window). Present on every 429 `too_many_requests` response.
      schema:
        type: integer
        minimum: 1
        example: 30
  schemas:
    Envelope:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
    CreateWalletResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - network
            - address
            - custody
            - funded
          properties:
            id:
              type: string
              format: uuid
            network:
              type: string
            address:
              type: string
            custody:
              type: string
              enum: [client, server]
              description: >
                `client` for non-custodial wallets (the server holds no key for this account).
                `server` is legacy, pre-cutover.
            funded:
              type: boolean
              description: Whether the account was funded on-chain (testnet friendbot).
          # NOTE: `recovery_mnemonic` was previously listed here as REQUIRED. It no longer exists
          # and must not come back: the client generates the mnemonic and the server never sees
          # it. Documenting it would contradict the non-custodial guarantee.
    WalletViewResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - network
            - address
          properties:
            id:
              type: string
              format: uuid
            network:
              type: string
            address:
              type: string
            label:
              type: string
            description:
              type: string
            balance_stroops:
              type: integer
    CreateAddressResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - muxed_address
            - base_address
            - memo_id
          properties:
            id:
              type: string
              format: uuid
            customer_ref:
              type: string
            muxed_address:
              type: string
            base_address:
              type: string
            memo_id:
              type: integer
    ListAddressesResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            required:
              - id
              - muxed_address
              - base_address
              - memo_id
            properties:
              id:
                type: string
                format: uuid
              customer_ref:
                type: string
              muxed_address:
                type: string
              base_address:
                type: string
              memo_id:
                type: integer
    WithdrawResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - status
            - destination
            - amount_stroops
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            stellar_tx_hash:
              type: string
            destination:
              type: string
            amount_stroops:
              type: integer
    ListTransactionsResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
    WebhookResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - id
            - url
            - secret
            - active
          properties:
            id:
              type: string
              format: uuid
            url:
              type: string
            secret:
              type: string
            active:
              type: boolean
    UploadSignatureResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          required:
            - signature
            - timestamp
            - api_key
            - cloud_name
          properties:
            signature:
              type: string
              description: Cloudinary upload signature. Never the API secret.
            timestamp:
              type: integer
            api_key:
              type: string
            cloud_name:
              type: string
            folder:
              type: string
              nullable: true
    ErrorResponse:
      type: object
      description: >
        Every error response, including framework rejections, unknown routes and the body-size
        limit. Branch on `code` (stable, never renamed or reused); `message` is for humans.
        A `too_many_requests` (429) response also carries a `Retry-After` header with the
        remaining window in whole seconds.
      required:
        - statusCode
        - code
        - message
        - data
      properties:
        statusCode:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code. See `x-error-codes` for meanings.
          enum:
            - bad_request
            - stale_sequence
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - already_exists
            - conflict
            - gone
            - payload_too_large
            - unsupported_media_type
            - too_many_requests
            - internal_error
            - service_unavailable
            - upstream_timeout
          x-error-codes:
            bad_request: { status: 400, meaning: The request was malformed or failed validation. }
            stale_sequence: { status: 400, meaning: "The transaction's sequence number is stale; refresh signing info and rebuild." }
            unauthorized: { status: 401, meaning: "Missing, invalid or revoked credentials." }
            forbidden: { status: 403, meaning: "Authenticated, but the server refuses this action for this resource." }
            not_found: { status: 404, meaning: "The resource or route does not exist, or is not visible to this caller." }
            method_not_allowed: { status: 405, meaning: The route exists but not for this HTTP method. }
            already_exists: { status: 409, meaning: A resource with this identity already exists (duplicate). }
            conflict: { status: 409, meaning: "The resource's current state does not allow this change." }
            gone: { status: 410, meaning: The endpoint or resource has been permanently removed or closed. }
            payload_too_large: { status: 413, meaning: The request body exceeds the 64 KiB limit. }
            unsupported_media_type: { status: 415, meaning: The request body has an unsupported Content-Type. }
            too_many_requests: { status: 429, meaning: "A rate limit or budget would be exceeded. The response carries a Retry-After header with the remaining window in seconds." }
            internal_error: { status: 500, meaning: "An internal error occurred; details are logged, never returned." }
            service_unavailable: { status: 503, meaning: "A server-side capability is not configured or temporarily unavailable; the request itself was valid." }
            upstream_timeout: { status: 504, meaning: "An upstream dependency (e.g. Horizon) did not answer in time." }
        message:
          type: string
        # Errors use the same {statusCode, message, data} envelope as success responses;
        # `data` is null. (The spec previously documented a non-existent `error` field.)
        data:
          nullable: true
    PaymentLinkResponse:
      type: object
      required:
        - statusCode
        - message
        - data
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
